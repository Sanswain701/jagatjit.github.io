<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    padding:20px;
    background:#041531;
    color:white;
    font-family:system-ui,sans-serif;
}

h1{
    text-align:center;
}

.back{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:12px;
    margin-top:20px;
}

.gallery img{
    width:100%;
    border-radius:12px;
    display:block;
}

.loading{
    text-align:center;
    margin-top:20px;
    font-size:20px;
}
</style>
</head>

<body>

<a href="index.html" class="back">← Back</a>

<h1>Gallery</h1>

<div id="loading" class="loading">Loading...</div>

<div id="gallery" class="gallery"></div>

<script>

alert("TEST 999");

alert("window.supabase = " + typeof window.supabase);

const SUPABASE_URL =
"https://yycgbleogwoifemxjczb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RYCEcdZrHw1PBv27E33atQ_UwV0QDUa";

alert("Before createClient");

const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

alert("After createClient");

async function loadGallery(){

    const loading =
    document.getElementById("loading");

    const gallery =
    document.getElementById("gallery");

    loading.innerHTML =
    "Connecting Supabase...";

    alert("Before list()");

    const result =
    await supabase.storage
    .from("gallery")
    .list("", { limit: 100 });

    alert("After list()");

    console.log(result);

    if(result.error){

        loading.innerHTML =
        "ERROR: " +
        result.error.message;

        alert(
        "ERROR: " +
        result.error.message
        );

        return;
    }

    loading.style.display =
    "none";

    result.data.forEach(file => {

        const img =
        document.createElement("img");

        img.src =
        SUPABASE_URL +
        "/storage/v1/object/public/gallery/" +
        encodeURIComponent(file.name);

        gallery.appendChild(img);

    });

    alert(
    "Loaded files: " +
    result.data.length
    );
}

loadGallery();

</script>

</body>
</html>
