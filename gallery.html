<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    padding:20px;
    background:#041531;
    color:white;
    font-family:system-ui,sans-serif;
}

h1{
    text-align:center;
}

.back{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:12px;
    margin-top:20px;
}

.gallery img{
    width:100%;
    border-radius:12px;
    display:block;
}

.loading{
    text-align:center;
    margin-top:20px;
    font-size:18px;
}

.error{
    color:#ff6b6b;
    text-align:center;
    margin-top:20px;
}
</style>
</head>

<body>

<a href="index.html" class="back">← Back</a>

<h1>Gallery</h1>

<div id="loading" class="loading">Loading...</div>

<div id="gallery" class="gallery"></div>

<div id="error" class="error"></div>

<script>

document.getElementById("loading").innerHTML = "JS Loaded";

const supabaseUrl =
"https://yycgbleogwoifemxjczb.supabase.co";

const supabaseKey =
"sb_publishable_RYCEcdZrHw1PBv27E33atQ_UwV0QDUa";

const supabase =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

async function loadGallery() {

    const gallery = document.getElementById("gallery");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");

    loading.innerHTML = "Connecting Supabase...";

    try {

        const result = await supabase
            .storage
            .from("gallery")
            .list("", { limit: 100 });

        console.log(result);

        loading.innerHTML = "Files Found: " +
        (result.data ? result.data.length : 0);

        if(result.error){
            errorBox.innerHTML =
            "Supabase Error: " +
            result.error.message;
            return;
        }

        gallery.innerHTML = "";

        result.data.forEach(file => {

            const img =
            document.createElement("img");

            img.src =
            supabaseUrl +
            "/storage/v1/object/public/gallery/" +
            encodeURIComponent(file.name);

            img.onerror = () => {
                console.log(
                    "Failed:",
                    file.name
                );
            };

            gallery.appendChild(img);

        });

        loading.style.display = "none";

    } catch(err){

        console.error(err);

        errorBox.innerHTML =
        "Catch Error: " + err.message;

    }

}

loadGallery();

</script>

</body>
</html>
