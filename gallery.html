<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    padding:20px;
    background:#041531;
    color:white;
    font-family:system-ui,sans-serif;
}

h1{
    text-align:center;
}

.back{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:12px;
    margin-top:20px;
}

.gallery img{
    width:100%;
    border-radius:12px;
    display:block;
}

.loading{
    text-align:center;
    margin-top:20px;
    font-size:18px;
}
</style>
</head>

<body>

<a href="index.html" class="back">← Back</a>

<h1>Gallery</h1>

<div id="gallery" class="gallery"></div>

<div id="loading" class="loading">
Loading...
</div>

<script>

const supabase = window.supabase.createClient(
    "https://yycgbleogwoifemxjczb.supabase.co",
    "sb_publishable_RYCEcdZrHw1PBv27E33atQ_UwV0QDUa"
);

async function loadGallery(){

    const gallery = document.getElementById("gallery");
    const loading = document.getElementById("loading");

    loading.style.display = "block";

    const { data, error } = await supabase
        .storage
        .from("gallery")
        .list("", {
            limit: 100
        });

    loading.style.display = "none";

    if(error){
        console.error(error);
        loading.innerHTML = "Gallery Load Error";
        loading.style.display = "block";
        return;
    }

    gallery.innerHTML = "";

    data.forEach(file => {

        const imageUrl =
        "https://yycgbleogwoifemxjczb.supabase.co/storage/v1/object/public/gallery/" +
        encodeURIComponent(file.name);

        const img = document.createElement("img");

        img.src = imageUrl;
        img.loading = "lazy";

        img.onerror = () => {
            console.log("Failed:", file.name);
        };

        gallery.appendChild(img);

    });

}

loadGallery();

</script>

</body>
</html>
