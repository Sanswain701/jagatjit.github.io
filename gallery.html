<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    padding:20px;
    background:#041531;
    color:white;
    font-family:system-ui,sans-serif;
}

h1{
    text-align:center;
}

.back{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:12px;
    margin-top:20px;
}

.gallery img{
    width:100%;
    border-radius:12px;
    display:block;
    aspect-ratio:1/1;
    object-fit:cover;
}

.loading{
    text-align:center;
    margin-top:20px;
    font-size:20px;
}
</style>
</head>

<body>

<a href="index.html" class="back">← Back</a>

<h1>Gallery</h1>

<div id="loading" class="loading">Loading...</div>

<div id="gallery" class="gallery"></div>

<script>

const { createClient } = supabase;

const client = createClient(
  "https://yycgbleogwoifemxjczb.supabase.co",
  "sb_publishable_RYCEcdZrHw1PBv27E33atQ_UwV0QDUa"
);

async function loadGallery() {

  const gallery = document.getElementById("gallery");
  const loading = document.getElementById("loading");

  try {

    const { data, error } = await client
      .storage
      .from("gallery")
      .list("", { limit: 100 });

    if (error) {
      loading.innerHTML = error.message;
      return;
    }

    loading.style.display = "none";

    data.forEach(file => {

      const img = document.createElement("img");

      img.src =
        "https://yycgbleogwoifemxjczb.supabase.co/storage/v1/object/public/gallery/" +
        encodeURIComponent(file.name);

      gallery.appendChild(img);

    });

  } catch (e) {
    loading.innerHTML = e.message;
  }
}

loadGallery();

</script>

</body>
</html>
